name: Cross-Platform Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install Haxe Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm setup --quiet
          haxelib run hmm install --quiet

      - name: Build Windows
        run: |
          haxelib run lime build windows -quiet

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuneVM-Windows
          path: export/**/bin

  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;33.0.2 platforms;android-33 ndk;25.2.9519653 platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install Haxe Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm setup --quiet
          haxelib run hmm install --quiet

      - name: Configure Lime Android Environment
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          
          echo "ANDROID_SDK=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          
          mkdir -p /home/runner/.lime
          cat <<EOF > /home/runner/.lime/config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <config>
            <define name="ANDROID_SETUP" value="true" />
            <section id="android">
              <path name="JAVA_HOME" value="$JAVA_HOME" />
              <path name="ANDROID_SDK" value="$ANDROID_HOME" />
              <path name="ANDROID_NDK_ROOT" value="$NDK_PATH" />
            </section>
          </config>
          EOF

      - name: Build Android APK
        run: |
          haxelib run lime build android -quiet -DHXCPP_ANDROID_PLATFORM=21 -DHXCPP_CPP11 -DNO_PRECOMPILED_HEADERS

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuneVM-Android
          path: export/android/bin/app/build/outputs/apk/**/*.apk
