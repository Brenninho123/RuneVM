name: Cross-Platform Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install Haxe Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm setup --quiet
          haxelib run hmm install --quiet

      - name: Build Windows
        run: |
          haxelib run lime build windows -quiet

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuneVM-Windows
          path: export/**/bin

  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;33.0.2 platforms;android-33 platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install Haxe Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm setup --quiet
          haxelib run hmm install --quiet

      - name: Configure Lime Android
        run: |
          mkdir -p ~/.lime
          echo '<?xml version="1.0" encoding="utf-8"?>' > ~/.lime/config.xml
          echo '<config>' >> ~/.lime/config.xml
          echo '  <section id="android">' >> ~/.lime/config.xml
          echo "    <path name=\"JAVA_HOME\" value=\"$JAVA_HOME\" />" >> ~/.lime/config.xml
          echo "    <path name=\"ANDROID_SDK\" value=\"$ANDROID_HOME\" />" >> ~/.lime/config.xml
          echo "    <path name=\"ANDROID_NDK_ROOT\" value=\"$ANDROID_NDK_LATEST_HOME\" />" >> ~/.lime/config.xml
          echo '  </section>' >> ~/.lime/config.xml
          echo '</config>' >> ~/.lime/config.xml

      - name: Build Android APK
        run: |
          haxelib run lime build android -quiet

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuneVM-Android
          path: export/android/bin/app/build/outputs/apk/**/*.apk
