name: Cross-Platform Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runevm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Validate Project
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path project.xml)) { throw 'Missing project.xml' }
          $content = (Get-Content project.xml -Raw -Encoding UTF8).TrimStart([char]0xFEFF, [char]0x20, [char]0x09, [char]0x0D, [char]0x0A)
          $xml = [System.Xml.XmlDocument]::new()
          $xml.LoadXml($content)
          if ($xml.DocumentElement.LocalName -ne 'project') { throw 'Expected project root' }
          [System.IO.File]::WriteAllText((Join-Path (Get-Location).Path 'project.xml'), $content, [System.Text.UTF8Encoding]::new($false))
          Write-Host 'Project XML validated and normalized'
      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          haxelib run hmm setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          haxelib run hmm install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          haxelib list
      - name: Build Windows
        run: |
          haxelib run lime build project.xml windows -release -64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows
        run: |
          $exe = Get-ChildItem export -Recurse -File -Filter RuneVM.exe | Select-Object -First 1
          if ($null -eq $exe) { throw 'RuneVM.exe not found' }
          New-Item -ItemType Directory -Force artifacts/RuneVM-Windows | Out-Null
          Copy-Item (Join-Path $exe.DirectoryName '*') artifacts/RuneVM-Windows -Recurse -Force
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: RuneVM-Windows-x64
          path: artifacts/RuneVM-Windows/
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2 ndk;25.2.9519653'
      - name: Configure Android
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          NDK="$SDK/ndk/25.2.9519653"
          test -d "$NDK"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_SDK=$SDK"
            echo "ANDROID_NDK_ROOT=$NDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_DIR=$NDK"
          } >> "$GITHUB_ENV"
      - name: Validate and Normalize Project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('project.xml')
          text = path.read_text(encoding='utf-8-sig').lstrip()
          ET.fromstring(text)
          path.write_text(text, encoding='utf-8')
          print('Project XML validated and normalized')
          PY
      - name: Install Libraries
        run: |
          set -euo pipefail
          haxelib install hmm --quiet
          haxelib run hmm setup
          haxelib run hmm install
          haxelib list
      - name: Configure Lime
        run: |
          set -euo pipefail
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
      - name: Build Android
        run: |
          set -euo pipefail
          haxelib run lime build project.xml android -release -DHXCPP_ANDROID_PLATFORM=21
      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p artifacts/RuneVM-Android
          find export -type f -name '*.apk' -exec cp {} artifacts/RuneVM-Android/ \;
          compgen -G 'artifacts/RuneVM-Android/*.apk' > /dev/null || { echo 'No APK generated'; exit 1; }
          ls -lh artifacts/RuneVM-Android/
      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: RuneVM-Android
          path: artifacts/RuneVM-Android/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RuneVM-Android-Diagnostics
          path: |
            export/**/*.log
            export/**/reports/**
          if-no-files-found: ignore
